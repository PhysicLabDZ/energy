<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الحصيلة الطاقوية">
<meta name="theme-color" content="#14967f">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>الحصيلة الطاقوية — عدة مصادر لإضاءة المصباح</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #f2f0ea;
    color: #2a2a38;
    font-family: system-ui, -apple-system, "Segoe UI", "Tahoma", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px 10px 30px;
  }
  .simulation-container {
    position: relative;
    width: 100%;
    max-width: 850px;
    height: 330px;
    background: #1a1a24;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
  }
  .canvas-wrapper { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
  svg { width: 100%; height: 100%; }

  .playback-row {
    display: flex;
    gap: 14px;
    align-items: center;
    justify-content: center;
    margin: 14px 0 20px;
  }
  .pb-btn {
    width: 56px; height: 56px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    cursor: pointer;
    border: none;
    transition: all .15s ease;
  }
  .pb-primary {
    background: #00838f;
    color: #fff;
    box-shadow: 0 3px 10px rgba(0,131,143,0.35);
  }
  .pb-primary:hover { background: #00acc1; }
  .pb-secondary {
    width: 42px; height: 42px;
    background: #fff;
    color: #555;
    border: 1.5px solid #d8d3c4;
  }
  .pb-secondary:hover { border-color: #00bcd4; color: #00838f; }

  /* mode selector */
  .mode-row {
    display: flex;
    gap: 14px;
    margin: 2px 0 16px;
  }
  .mode-btn {
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 1.5px solid #d8d3c4;
    background: #fff;
    font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all .15s ease;
    color: #888;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  .mode-btn:hover { border-color: #00bcd4; }
  .mode-btn.active {
    border-color: #00bcd4;
    background: rgba(0,188,212,0.10);
    box-shadow: 0 0 10px rgba(0,188,212,0.25);
    color: #1a1a24;
  }

  /* bubble / energy balance panel */
  .balance-container {
    width: 100%;
    max-width: 850px;
    margin-bottom: 16px;
  }
  .canvas-wrap2 {
    width: 100%;
    height: 340px;
    min-height: 300px;
  }
  #bubbleCanvas { width: 100%; height: 100%; display: block; }

  .principle-card {
    width: 100%;
    max-width: 850px;
    background: #1a1a24;
    border: 1px solid #2d2d3d;
    border-radius: 16px;
    padding: 14px 18px;
    margin-bottom: 10px;
  }
  .principle-card h3 { font-size: 13.5px; margin-bottom: 8px; color: #eee; }
  .principle-card p { font-size: 12.5px; line-height: 1.7; color: #9aa0a6; margin-bottom: 10px; }
  .principle-eq {
    direction: ltr; text-align: center;
    font-family: "Consolas","Courier New",monospace;
    font-size: 14px; font-weight: 700; color: #00bcd4;
    background: #121218; border: 1px dashed #2d2d3d;
    border-radius: 10px; padding: 10px;
  }

  footer { text-align: center; font-size: 10.5px; color: #6b7076; margin-top: 6px; }

  /* ===== وضع سطح المكتب: عمودان جنبًا إلى جنب على الشاشات العريضة ===== */
  .desktop-wrap { width: 100%; display: flex; flex-direction: column; align-items: center; }
  @media (min-width: 980px) {
    .desktop-wrap {
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      gap: 32px;
      max-width: 1400px;
    }
    .left-col, .right-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: auto;
    }
    .left-col { flex: 1 1 52%; max-width: 760px; }
    .right-col { flex: 1 1 48%; max-width: 700px; position: sticky; top: 20px; }
    .simulation-container, .balance-container, .principle-card { max-width: none; width: 100%; }
    .canvas-wrap2 { height: 460px; }
  }
</style>
</head>
<body>

<div class="desktop-wrap">
<div class="left-col">
<div class="mode-row">
  <button class="mode-btn active" id="btn-water" title="ماء">💧</button>
  <button class="mode-btn" id="btn-wind" title="رياح">🌬️</button>
  <button class="mode-btn" id="btn-stone" title="سقوط جسم">🪨</button>
  <button class="mode-btn" id="btn-sun" title="الفعل الكهروضوئي">☀️</button>
</div>

<div class="simulation-container">
  <div class="canvas-wrapper">
    <svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur id="blur-elem" stdDeviation="0" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <radialGradient id="glassGrad" cx="35%" cy="30%" r="65%">
          <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
          <stop offset="50%" stop-color="rgba(255,255,255,0.05)"/>
          <stop offset="95%" stop-color="rgba(255,255,255,0.15)"/>
        </radialGradient>
        <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#444"/>
          <stop offset="25%" stop-color="#d0d0d0"/>
          <stop offset="50%" stop-color="#999"/>
          <stop offset="75%" stop-color="#eeeeee"/>
          <stop offset="100%" stop-color="#222"/>
        </linearGradient>
        <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="rgba(0, 212, 255, 0.5)"/>
          <stop offset="50%" stop-color="rgba(220, 248, 255, 0.9)"/>
          <stop offset="100%" stop-color="rgba(0, 180, 240, 0.6)"/>
        </linearGradient>
        <radialGradient id="bulbAura" cx="50%" cy="50%" r="50%">
          <stop id="aura-inner" offset="0%" stop-color="#ffcc33" stop-opacity="0"/>
          <stop id="aura-outer" offset="100%" stop-color="#ff6600" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="stoneGrad" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#9a9a9a"/>
          <stop offset="100%" stop-color="#4a4a4a"/>
        </radialGradient>
      </defs>

      <circle id="aura" cx="580" cy="210" r="160" fill="url(#bulbAura)"/>

      <!-- ================= WATER MECHANISM ================= -->
      <g id="mech-water">
        <path d="M 90 0 L 90 50 A 20 20 0 0 0 110 70 L 125 70 A 15 15 0 0 1 140 85 L 140 100"
              fill="none" stroke="url(#metalGrad)" stroke-width="22" stroke-linecap="square"/>
        <path d="M 90 0 L 90 50 A 20 20 0 0 0 110 70 L 125 70 A 15 15 0 0 1 140 85 L 140 100"
              fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-linecap="square"/>
        <rect x="126" y="98" width="28" height="8" rx="2" fill="url(#metalGrad)" stroke="#333" stroke-width="1"/>
        <g id="faucet-valve" transform="translate(90, 30)">
          <rect x="-6" y="-12" width="12" height="12" fill="url(#metalGrad)" stroke="#333" stroke-width="1"/>
          <g id="valve-handle">
            <ellipse cx="0" cy="-14" rx="22" ry="7" fill="#d32f2f" stroke="#9a0007" stroke-width="1.5"/>
            <circle cx="0" cy="-14" r="4" fill="#fff"/>
          </g>
        </g>
        <g id="water-stream-group">
          <rect id="water-stream" x="130" y="106" width="20" height="135" fill="url(#waterGrad)" rx="3" opacity="0"/>
          <g id="water-splash" opacity="0" transform="translate(140, 240)">
            <ellipse cx="-8" cy="-2" rx="6" ry="2" fill="#e0f7fa"/>
            <ellipse cx="8" cy="-4" rx="5" ry="2" fill="#e0f7fa"/>
            <circle cx="-12" cy="-8" r="2" fill="#b2ebf2"/>
            <circle cx="10" cy="-10" r="2.5" fill="#b2ebf2"/>
          </g>
        </g>
      </g>

      <!-- ================= WIND MECHANISM ================= -->
      <g id="mech-wind" fill="#00bcd4">
        <g class="wArrow"><path d="M10,150 L45,150 L45,141 L68,158 L45,175 L45,166 L10,166 Z"/></g>
        <g class="wArrow"><path d="M10,180 L45,180 L45,171 L68,188 L45,205 L45,196 L10,196 Z"/></g>
        <g class="wArrow"><path d="M10,210 L45,210 L45,201 L68,218 L45,235 L45,226 L10,226 Z"/></g>
        <g class="wArrow"><path d="M10,240 L45,240 L45,231 L68,248 L45,265 L45,256 L10,256 Z"/></g>
        <g class="wArrow"><path d="M10,270 L45,270 L45,261 L68,278 L45,295 L45,286 L10,286 Z"/></g>
      </g>

      <!-- ================= WIRING ================= -->
      <path id="wire1" d="M 230 260 L 390 260 L 390 320 L 568 320" fill="none" stroke="#4a4a5a" stroke-width="4" stroke-linecap="round"/>
      <path id="wire2" d="M 230 270 L 370 270 L 370 360 L 580 360 L 580 347" fill="none" stroke="#4a4a5a" stroke-width="4" stroke-linecap="round"/>

      <!-- ================= TURBINE / GENERATOR SYSTEM ================= -->
      <g id="turbine-group">
        <g id="generic-housing">
          <path d="M 190 350 L 270 350 L 255 270 L 205 270 Z" fill="#242b35" stroke="#34495e" stroke-width="2"/>
          <rect x="170" y="350" width="120" height="15" rx="4" fill="#1c2229"/>
          <rect x="200" y="240" width="60" height="45" rx="6" fill="#2c3e50" stroke="#455a64" stroke-width="2"/>
          <!-- إبراز المولد/الخلية كجملة مستقلة (إطار وتسمية فقط، بلا تأثير على التركيبة) -->
          <rect x="193" y="233" width="74" height="59" rx="10" fill="none" stroke="#4dd0e1" stroke-width="1.6" stroke-dasharray="4,3" opacity="0.85"/>
          <text id="genLabel" x="230" y="303" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4dd0e1">المولد</text>
          <circle cx="230" cy="262" r="12" fill="#7f8c8d"/>
        </g>

        <g id="turbine-blades" transform="translate(230, 262)">
          <g id="fan-blades-only">
            <path d="M 0 0 C -15 -40 -35 -65 -5 -85 C 15 -65 12 -40 0 0" fill="#00adb5" stroke="#00797f" stroke-width="1.5"/>
            <path d="M 0 0 C 40 -15 65 -35 85 -5 C 65 15 40 12 0 0" fill="#00adb5" stroke="#00797f" stroke-width="1.5"/>
            <path d="M 0 0 C 15 40 35 65 5 85 C -15 65 -12 40 0 0" fill="#00adb5" stroke="#00797f" stroke-width="1.5"/>
            <path d="M 0 0 C -40 15 -65 35 -85 5 C -65 -15 -40 -12 0 0" fill="#00adb5" stroke="#00797f" stroke-width="1.5"/>
          </g>
          <g id="hub-only">
            <circle cx="0" cy="0" r="14" fill="#e74c3c"/>
            <circle cx="0" cy="0" r="6" fill="#c0392b"/>
          </g>
          <g id="pulley-only" style="display:none">
            <circle cx="0" cy="0" r="17" fill="url(#metalGrad)" stroke="#333" stroke-width="1.5"/>
            <circle cx="0" cy="0" r="6" fill="#333"/>
            <line x1="-17" y1="0" x2="17" y2="0" stroke="#555" stroke-width="1.5"/>
          </g>
        </g>
      </g>

      <!-- ================= STONE MECHANISM (الخيط والحجر — البكرة مثبتة على محور المولد ذاته، تُرسم فوق الهيكل) ================= -->
      <g id="mech-stone">
        <line id="stone-string" x1="230" y1="262" x2="230" y2="300" stroke="#8a8a8a" stroke-width="2"/>
        <g id="stone-weight" transform="translate(230,310)">
          <path d="M -14 -9 L 14 -9 L 18 7 L 9 16 L -9 16 L -18 7 Z" fill="url(#stoneGrad)" stroke="#2a2a2a" stroke-width="1.5"/>
        </g>
      </g>

      <!-- ================= SOLAR / PHOTOVOLTAIC MECHANISM ================= -->
      <g id="mech-sun">
        <defs>
          <radialGradient id="sunGrad" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#fff6c8"/>
            <stop offset="55%" stop-color="#ffd60a"/>
            <stop offset="100%" stop-color="#ffa700"/>
          </radialGradient>
          <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#1c3a5e"/>
            <stop offset="100%" stop-color="#0d2038"/>
          </linearGradient>
        </defs>

        <g transform="translate(100,60)">
          <circle r="24" fill="url(#sunGrad)"/>
          <circle r="24" fill="none" stroke="#ffb300" stroke-width="1.5"/>
          <g stroke="#ffd60a" stroke-width="3.2" stroke-linecap="round">
            <line x1="0" y1="-35" x2="0" y2="-45"/>
            <line x1="0" y1="35" x2="0" y2="45"/>
            <line x1="-35" y1="0" x2="-45" y2="0"/>
            <line x1="35" y1="0" x2="45" y2="0"/>
            <line x1="25" y1="-25" x2="32" y2="-32"/>
            <line x1="-25" y1="-25" x2="-32" y2="-32"/>
            <line x1="25" y1="25" x2="32" y2="32"/>
            <line x1="-25" y1="25" x2="-32" y2="32"/>
          </g>
        </g>

        <!-- حزمة أشعة متصلة فعليًا بين الشمس والخلية (لا فجوة)، بخط متحرك يوحي بالتدفق المستمر -->
        <g stroke="#ffd60a" stroke-linecap="round" fill="none">
          <line class="sunBeam" x1="121.8" y1="76.5" x2="187.8" y2="218.5" stroke-width="2.2" opacity="0.55"/>
          <line class="sunBeam" x1="110"   y1="82"   x2="176"   y2="224"   stroke-width="2.8" opacity="0.85"/>
          <line class="sunBeam" x1="98.2"  y1="87.5" x2="164.2" y2="229.5" stroke-width="2.2" opacity="0.55"/>
        </g>

        <line x1="235" y1="258" x2="235" y2="350" stroke="#555" stroke-width="7"/>
        <rect x="205" y="350" width="60" height="14" rx="3" fill="#1c2229"/>

        <g transform="translate(235,235) rotate(-14)">
          <rect x="-55" y="-25" width="110" height="50" rx="4" fill="url(#panelGrad)" stroke="#3f8fb5" stroke-width="2.5"/>
          <line x1="-18" y1="-25" x2="-18" y2="25" stroke="#3f8fb5" stroke-width="1"/>
          <line x1="18"  y1="-25" x2="18"  y2="25" stroke="#3f8fb5" stroke-width="1"/>
          <line x1="-55" y1="0"   x2="55"  y2="0"  stroke="#3f8fb5" stroke-width="1"/>
          <path d="M -50 -20 L -30 -20 L -46 20 L -50 20 Z" fill="#ffffff" opacity="0.06"/>
          <rect id="pvGlow" x="-55" y="-25" width="110" height="50" rx="4" fill="#4dd0e1" opacity="0"/>
        </g>
      </g>


      <!-- ================= INCANDESCENT BULB ================= -->
      <g id="bulb-group" transform="translate(500, 70)">
        <path d="M 68 250 L 92 250 L 92 258 C 92 261 68 261 68 261 Z" fill="url(#metalGrad)" stroke="#444"/>
        <path d="M 68 261 L 92 261 L 92 269 C 92 272 68 272 68 272 Z" fill="url(#metalGrad)" stroke="#444"/>
        <path d="M 68 272 L 92 272 L 92 280 C 92 283 68 283 68 283 Z" fill="url(#metalGrad)" stroke="#444"/>
        <path d="M 72 283 L 88 283 L 85 290 L 75 290 Z" fill="#1a1a1a"/>
        <path d="M 76 290 L 84 290 L 82 296 L 78 296 Z" fill="url(#metalGrad)"/>
        <path d="M 74 250 L 86 250 L 83 190 L 77 190 Z" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
        <path d="M 77 250 L 77 185 L 70 155" fill="none" stroke="#777" stroke-width="1.5"/>
        <path d="M 83 250 L 83 185 L 90 155" fill="none" stroke="#777" stroke-width="1.5"/>
        <path d="M 70 155 Q 75 146 80 152 Q 85 146 90 155" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round"/>
        <path id="filament-glow" d="M 70 155 Q 75 146 80 152 Q 85 146 90 155" fill="none" stroke="#ffea78" stroke-width="2.5" stroke-linecap="round" opacity="0" filter="url(#glow)"/>
        <path d="M 68 250
                 C 58 220 48 198 38 165
                 C 22 125 35 65 80 65
                 C 125 65 138 125 122 165
                 C 112 198 102 220 92 250 Z"
              fill="url(#glassGrad)"
              stroke="rgba(255,255,255,0.35)"
              stroke-width="1.5"/>
        <path d="M 46 155 C 36 120 44 80 72 72" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="114" cy="105" r="4" fill="rgba(255,255,255,0.25)"/>
      </g>
    </svg>
  </div>

</div>

<div class="playback-row">
  <button id="resetBtn" class="pb-btn pb-secondary" title="إعادة">⟲</button>
  <button id="playBtn" class="pb-btn pb-primary" title="تشغيل">▶</button>
</div>
</div>

<div class="right-col">
<div class="balance-container">
  <div class="canvas-wrap2"><canvas id="bubbleCanvas"></canvas></div>
</div>

<footer>محاكاة تفاعلية — PhysicLabDZ</footer>
<div id="debugErr" style="max-width:850px;width:100%;font-size:10px;color:#c0392b;text-align:center;margin-top:6px;word-break:break-all;"></div>
</div>
</div>

<script src="script.obf.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>

</body>
</html>
